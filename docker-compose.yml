services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: creditflow
      POSTGRES_USER: creditflow
      POSTGRES_PASSWORD: creditflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U creditflow -d creditflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    init: true
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://creditflow:creditflow@${POSTGRES_HOST:-db}:5432/creditflow?schema=public
      AUTH_TRUST_HOST: "true"
      NODE_ENV: development
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data: